function matchCandidateToRequest(c,r){const a=state.db.candidateAnalysis[c.id]||analyzeCandidate(c);const expScore=clamp((Number(c.yearsExperience)>=r.minExperience?100:(Number(c.yearsExperience)/Math.max(1,r.minExperience))*100));const skillScore=clamp(overlap(c.skills?.technical+' '+c.skills?.functional+' '+c.skills?.soft,r.requiredSkills+' '+r.preferredSkills)*100+30);const industryScore=clamp(overlap(c.experiences?.map(e=>e.industry).join(' '),r.industry+' '+r.subSector)*100+25);const compScore=clamp(overlap(c.skills?.soft+' '+c.skills?.management+' '+c.skills?.leadership,r.competencies+' '+r.leadershipSkills)*100+35);const eduScore=clamp(overlap(c.education?.major,c.major)*100+45);const locScore=(c.preferredLocation===r.location||c.governorate===r.location||c.willingToRelocate==='Yes'||r.relocation==='Yes')?90:45;const salaryScore=(Number(c.expectedSalary||0)<=Number(r.salaryMax||0)&&Number(c.minSalary||0)<=Number(r.salaryMax||0))?90:40;const sysScore=clamp(overlap(c.skills?.systems+' '+c.skills?.erp,r.systems+' '+r.erp)*100+40);const langScore=r.languages&&c.languages?.length?80:40;const lvlScore=c.careerLevel===r.careerLevel?100:overlap(c.careerLevel,r.careerLevel)*100+40;const avScore=c.availability==='Immediate'||r.urgency!=='High'?90:65;const w=state.db.matchingRules;const weighted=(expScore*w.experience+skillScore*w.skills+compScore*w.competencies+industryScore*w.industry+Math.max(eduScore,lvlScore)*w.field+w.education*0);let total=(expScore*w.experience+skillScore*w.skills+compScore*w.competencies+industryScore*w.industry+Math.max(overlap(c.targetCareerField,r.field)*100,overlap(c.specialization,r.specialization)*100)*w.field+eduScore*w.education+locScore*w.location+salaryScore*w.salary+sysScore*w.systems+langScore*w.languages)/100;return {candidateId:c.id,experience:Math.round(expScore),skills:Math.round(skillScore),industry:Math.round(industryScore),competency:Math.round(compScore),education:Math.round(eduScore),location:Math.round(locScore),salary:Math.round(salaryScore),systems:Math.round(sysScore),languages:Math.round(langScore),careerLevel:Math.round(lvlScore),availability:Math.round(avScore),overall:Math.round(total),evidence:{experience:`Required ${r.minExperience}-${r.maxExperience} years; candidate has ${c.yearsExperience}.`,skills:`Relevant skill overlap calculated from structured technical, functional and soft skills.`,industry:`Candidate industry history compared with ${r.industry} / ${r.subSector}.`,competency:`Candidate competencies compared with ${r.competencies}.`,education:`Candidate major ${c.education?.major||''} compared with ${r.major}.`,location:`Candidate preferred location ${c.preferredLocation||c.governorate} vs ${r.location}.`,salary:`Expected ${c.expectedSalary||0} vs request range ${r.salaryMin}-${r.salaryMax}.`,systems:`Systems evidence compared with ${r.systems||r.erp}.`}}}
function runMatching(r){const arr=state.db.candidates.map(c=>matchCandidateToRequest(c,r)).sort((a,b)=>b.overall-a.overall);state.db.matchingResults[r.id]=arr;state.db.notifications.unshift({id:uid('N'),type:'Matching Completed',text:`Matching completed for ${r.position}.`,date:isoNow(),read:false});log('Admin ran matching','Matching',r.id);save();return arr}
function opportunityCount(c){return state.db.recruitmentRequests.filter(r=>matchCandidateToRequest(c,r).overall>=state.db.matchingRules.minimumThreshold).length}
function applyDataToForm(c){state.updateCandidateId=c?.id||null;renderCandidateForm(c)}
function csvExport(rows,filename){if(!rows.length){toast(t('NoData'),'error');return}const cols=[...new Set(rows.flatMap(o=>Object.keys(o)))];const csv=[cols.join(','),...rows.map(o=>cols.map(k=>`"${String(Array.isArray(o[k])?o[k].join(' | '):o[k]??'').replace(/"/g,'""')}"`).join(','))].join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);log('Admin exported report','Reports',filename)}
function updateDb(id,data){const ix=state.db.candidates.findIndex(x=>x.id===id);if(ix<0)return;state.db.candidates[ix]={...state.db.candidates[ix],...data,updatedDate:isoNow()};const c=state.db.candidates[ix];state.db.candidateCVs[id]={candidateId:id,fileName:c.cvFileName||''};state.db.candidateApplications[id]={...state.db.candidateApplications[id],candidateId:id,updatedDate:isoNow()};state.db.candidateAnalysis[id]=analyzeCandidate(c);state.db.candidateIndicators[id]=state.db.candidateAnalysis[id].indicators;log('Admin updated candidate','Candidates',id);save();}
function load(){const raw=localStorage.getItem(APP_KEY);if(raw){try{const x=JSON.parse(raw);state.db=x.db;state.theme={...DEFAULT_THEME,...(x.theme||{})};}catch(e){state.db=null}}if(!state.db||!Array.isArray(state.db.candidates)||!Array.isArray(state.db.companies)||!Array.isArray(state.db.recruitmentRequests)||!Array.isArray(state.db.consultationRequests)||!state.db.adminUsers||!state.db.matchingRules||!state.db.siteSettings){state.db=seedDB();save()}setThemeVars()}

function statCard(label,value,route,accent='') {return `<div class="stat-card" data-action="admin-stat" data-route="${esc(route)}" style="border-top:3px solid ${accent||'var(--primary)'}"><div class="stat-label">${esc(label)}</div><div class="stat-value">${value}</div></div>`}
function adminDashboard(){const d=state.db;const open=d.recruitmentRequests.filter(r=>r.status==='Open').length;const positions=d.recruitmentRequests.reduce((n,r)=>n+Number(r.numberRequired||0),0);const matchCount=new Set(Object.values(d.matchingResults).flat().filter(x=>x.overall>=d.matchingRules.minimumThreshold).map(x=>x.candidateId)).size;const shortlist=d.candidates.filter(c=>c.status==='Shortlisted').length;const conNew=d.consultationRequests.filter(x=>x.status==='New').length, conActive=d.consultationRequests.filter(x=>x.status==='Active'||x.status==='Assigned').length, conDone=d.consultationRequests.filter(x=>x.status==='Completed').length;const due=d.communicationLogs.filter(x=>x.status==='Due').length;return adminShell(`<div class="stat-grid">${statCard('Total Candidates',d.candidates.length,'#admin/candidates')}${statCard('Job Seekers',d.candidates.length,'#admin/candidates','var(--secondary)')}${statCard('Total Companies',d.companies.length,'#admin/companies','var(--accent)')}${statCard('Open Recruitment Requests',open,'#admin/recruitment','var(--orange)')}${statCard('Total Requested Positions',positions,'#admin/recruitment')}${statCard('Matching Candidates',matchCount,'#admin/matching','var(--secondary)')}${statCard('Shortlisted Candidates',shortlist,'#admin/candidates','var(--cashmere)')}${statCard('Consultation Requests',d.consultationRequests.length,'#admin/consultations')}${statCard('New Consultations',conNew,'#admin/consultations','var(--orange)')}${statCard('Active Consultations',conActive,'#admin/consultations','var(--secondary)')}${statCard('Completed Consultations',conDone,'#admin/consultations','var(--cashmere)')}${statCard('Data Update Due',due,'#admin/campaign','var(--accent)')}</div><div class="admin-section mini-grid"><div class="chart-card surface"><div class="section-head" style="margin-bottom:15px"><div><h3>Candidates by Field</h3></div></div>${barChart(groupCount(d.candidates,'targetCareerField'),d.candidates.length)}</div><div class="chart-card surface"><div class="section-head" style="margin-bottom:15px"><div><h3>Consultations by Status</h3></div></div>${barChart(groupCount(d.consultationRequests,'status'),d.consultationRequests.length)}</div></div><div class="admin-section mini-grid"><div class="chart-card surface"><h3>Recruitment Requests by Industry</h3>${barChart(groupCount(d.recruitmentRequests,'industry'),d.recruitmentRequests.length)}</div><div class="chart-card surface"><h3>Data Update Status</h3>${barChart(groupCount(d.communicationLogs,'status'),d.communicationLogs.length)}</div></div>`,'Dashboard')}
function groupCount(rows,key){const m={};rows.forEach(x=>{const v=Array.isArray(x[key])?x[key].join(', '):(x[key]||'Other');m[v]=(m[v]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8)}
function barChart(data,total){if(!data.length)return `<div class="empty">${esc(t('NoData'))}</div>`;const max=Math.max(...data.map(x=>x[1]),1);return `<div class="bars" style="margin-top:15px">${data.map(x=>`<div class="bar-row"><span>${esc(x[0])}</span><div class="bar"><span style="width:${Math.round(x[1]/max*100)}%"></span></div><strong>${x[1]}</strong></div>`).join('')}</div>`}
function adminCandidates(){let rows=state.db.candidates.slice();const q=(state.filters.candidateSearch||'').toLowerCase();if(q)rows=rows.filter(c=>JSON.stringify(c).toLowerCase().includes(q));const field=state.filters.field;if(field)rows=rows.filter(c=>c.targetCareerField===field);const page=paginate(rows,state.filters.cp||1);return adminShell(`<div class="toolbar"><div class="toolbar-left"><div class="search-box"><input id="candidateSearch" placeholder="Search name, ID, field, specialization..." value="${esc(state.filters.candidateSearch||'')}"></div><select id="candidateField"><option value="">All Fields</option>${FIELDS.map(x=>`<option ${field===x?'selected':''}>${esc(x)}</option>`).join('')}</select><button class="btn btn-ghost btn-sm" data-action="apply-candidate-filter">${esc(t('Filter'))}</button></div><div class="toolbar-right">${button(t('Export'),'btn-primary','export-candidates')}</div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Candidate</th><th>Field</th><th>Specialization</th><th>Experience</th><th>Location</th><th>Profile Score</th><th>Status</th><th>Last Updated</th><th></th></tr></thead><tbody>${page.data.map(c=>{const a=state.db.candidateAnalysis[c.id]||analyzeCandidate(c);return `<tr><td><strong>${esc(c.fullName)}</strong><br><span class="small muted">${esc(c.id)}</span></td><td>${esc(c.targetCareerField)}</td><td>${esc(c.specialization)}</td><td>${c.yearsExperience} yrs</td><td>${esc(c.preferredLocation||c.governorate)}</td><td><span class="badge navy">${a.overall}%</span></td><td><span class="badge ${c.status==='Shortlisted'?'green':c.status==='New'?'orange':''}">${esc(c.status)}</span></td><td>${esc(fmtDate(c.updatedDate))}</td><td>${button(t('Open'),'btn-ghost btn-sm',`open-candidate:${c.id}`)}</td></tr>`}).join('')||`<tr><td colspan="9"><div class="empty">${esc(t('NoData'))}</div></td></tr>`}</tbody></table></div>${pagination(page,'candidate-page')}`,'Candidates')}
function paginate(rows,p=1,per=10){const pages=Math.max(1,Math.ceil(rows.length/per));p=Math.min(Math.max(1,p),pages);return {data:rows.slice((p-1)*per,p*per),page:p,pages,total:rows.length}}
function pagination(p,key){return `<div style="display:flex;justify-content:space-between;align-items:center;padding:14px 2px;gap:10px"><span class="small muted">${p.total} records · Page ${p.page} / ${p.pages}</span><div style="display:flex;gap:6px"><button class="btn btn-ghost btn-sm" data-action="page" data-key="${key}" data-page="${p.page-1}">Previous</button>${Array.from({length:Math.min(5,p.pages)},(_,i)=>{let n=Math.max(1,Math.min(p.pages,p.page-2+i));return `<button class="btn ${n===p.page?'btn-primary':'btn-ghost'} btn-sm" data-action="page" data-key="${key}" data-page="${n}">${n}</button>`}).join('')}<button class="btn btn-ghost btn-sm" data-action="page" data-key="${key}" data-page="${p.page+1}">Next</button></div></div>`}
function candidateDetail(id){const c=state.db.candidates.find(x=>x.id===id);if(!c)return adminShell(`<div class="empty">Candidate not found</div>`,'Candidate');const a=state.db.candidateAnalysis[id]||analyzeCandidate(c);const matches=state.db.recruitmentRequests.flatMap(r=>{const m=matchCandidateToRequest(c,r);return m.overall>=state.db.matchingRules.minimumThreshold?[{r,m}]:[]});const tab=state.tab;let content='';const simple=(obj)=>`<div class="detail-grid">${Object.entries(obj).map(([k,v])=>`<div class="detail-item"><div class="label">${esc(k)}</div><div class="value">${esc(typeof v==='object'?JSON.stringify(v,null,2):v)}</div></div>`).join('')}</div>`;if(tab==='Overview')content=`<div class="grid-2"><div class="surface" style="padding:20px"><h3>Profile Summary</h3><p>${esc(a.summary)}</p><div class="op-count" style="font-size:3rem">${a.overall}%</div><span class="badge navy">Profile Score</span></div><div class="surface" style="padding:20px"><h3>Candidate Communication</h3><p class="muted">${esc(c.email)}<br>${esc(c.primaryPhone)}<br>${esc(c.secondaryPhone)}<br>${esc(c.whatsappNumber)}</p><div class="toolbar-right">${button('Demo WhatsApp','btn-secondary',`demo-whatsapp:${id}`)}${button('Demo Email','btn-primary',`demo-email:${id}`)}${button('Update Reminder','btn-orange',`candidate-reminder:${id}`)}</div></div></div><div class="admin-section surface" style="padding:20px"><h3>Current Opportunity Count</h3><div class="op-count" style="font-size:3rem">${opportunityCount(c)}</div><span class="muted">Internal count across current recruitment requirements.</span></div>`;
else if(tab==='Personal Data')content=simple({FullName:c.fullName,ArabicName:c.arabicName,EnglishName:c.englishName,Email:c.email,PrimaryPhone:c.primaryPhone,SecondaryPhone:c.secondaryPhone,WhatsApp:c.whatsappNumber,Location:c.location,Governorate:c.governorate,City:c.city,DateOfBirth:c.dateOfBirth,Gender:c.gender,MaritalStatus:c.maritalStatus,Nationality:c.nationality,ContactPreference:c.preferredContactMethod});
else if(tab==='Career')content=simple({TargetField:c.targetCareerField,Specialization:c.specialization,TargetPosition:c.targetPosition,CareerLevel:c.careerLevel,YearsExperience:c.yearsExperience,CurrentPosition:c.currentPosition,CurrentCompany:c.currentCompany,Availability:c.availability,EmploymentType:c.employmentTypePreference,PreferredLocation:c.preferredLocation,WillingToRelocate:c.willingToRelocate});
else if(tab==='Education')content=simple(c.education||{});
else if(tab==='Experience')content=`${(c.experiences||[]).map((e,i)=>`<div class="surface" style="padding:18px;margin-bottom:12px"><h3>${i+1}. ${esc(e.title)} · ${esc(e.company)}</h3>${simple(e)}</div>`).join('')}`;
else if(tab==='Skills')content=simple(c.skills||{});
else if(tab==='CV')content=`<div class="surface" style="padding:24px"><h3>CV</h3><p>Filename: <strong>${esc(c.cvFileName||'Not uploaded')}</strong></p><div class="notice">Demo only. The file itself is not uploaded to a server.</div></div>`;
else if(tab==='Application Form')content=simple({Submitted:c.createdDate,Updated:c.updatedDate,Source:state.db.candidateApplications[id]?.source||'Public Candidate Form'});
else if(tab==='AI Analysis')content=`<div class="notice"><strong>${esc(t('DemoAI'))}</strong> · ${esc(t('RuleBased'))} · ${esc(t('NoAPI'))}</div><div class="surface" style="padding:20px;margin-top:15px"><h3>Profile Summary</h3><p>${esc(a.summary)}</p><h3>Consistency Analysis</h3><p>${esc(a.consistency)}</p><h3>Strengths</h3><ul>${a.strengths.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3>Gaps</h3><ul>${a.gaps.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3>Recommendations for Recruiter</h3><p>${esc(a.recommendations)}</p></div>`;
else if(tab==='Indicators')content=`<div class="surface" style="padding:20px"><div class="kpi-list">${a.indicators.map(x=>`<div class="kpi-item"><span>${esc(x.name)}</span><strong>${x.score}%</strong></div>`).join('')}</div></div>`;
else if(tab==='Matching')content=`<div class="surface" style="padding:20px"><h3>Matching Opportunities — Admin Only</h3>${matches.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Request</th><th>Company</th><th>Position</th><th>Overall</th><th>Status</th></tr></thead><tbody>${matches.map(x=>`<tr><td>${x.r.id}</td><td>${esc(x.r.company)}</td><td>${esc(x.r.position)}</td><td><span class="badge green">${x.m.overall}%</span></td><td>${esc(x.r.status)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No matching requests at current threshold.</div>`}</div>`;
else if(tab==='Reports')content=`<div class="grid-2"><div class="surface" style="padding:20px"><h3>Candidate Report</h3>${button('Export Candidate','btn-primary',`export-candidate:${id}`)}</div><div class="surface" style="padding:20px"><h3>Matching Report</h3>${button('Export Matches','btn-secondary',`export-candidate-matches:${id}`)}</div></div>`;
else content=`<div class="surface" style="padding:20px"><h3>Activity</h3>${state.db.auditLogs.filter(x=>x.record===id).slice(0,15).map(x=>`<div class="kpi-item"><span>${esc(x.action)} · ${esc(x.module)}</span><span class="muted">${esc(fmtDate(x.date))}</span></div>`).join('')||'<div class="empty">No activity recorded yet.</div>'}</div>`;
return adminShell(`<div class="breadcrumb"><a href="#admin/candidates">Candidates</a> › ${esc(c.fullName)}</div><div class="surface" style="padding:20px"><div style="display:flex;justify-content:space-between;gap:16px;align-items:start"><div><h2 style="margin:0;color:var(--primary)">${esc(c.fullName)}</h2><p class="muted">${esc(c.id)} · ${esc(c.targetCareerField)} · ${esc(c.specialization)}</p></div><div>${button('Edit Candidate','btn-primary',`edit-candidate:${id}`)}</div></div><div class="tab-row" style="margin-top:20px">${['Overview','Personal Data','Career','Education','Experience','Skills','CV','Application Form','AI Analysis','Indicators','Matching','Reports','Activity'].map(x=>`<button class="tab-btn ${tab===x?'active':''}" data-action="candidate-tab" data-tab="${x}">${x}</button>`).join('')}</div>${content}</div>`,'Candidate Profile')}
function companiesPage(){let rows=state.db.companies;const q=(state.filters.companySearch||'').toLowerCase();if(q)rows=rows.filter(c=>JSON.stringify(c).toLowerCase().includes(q));const page=paginate(rows,state.filters.compPage||1);return adminShell(`<div class="toolbar"><div class="toolbar-left"><div class="search-box"><input id="companySearch" placeholder="Search company, industry, location..." value="${esc(state.filters.companySearch||'')}"></div><button class="btn btn-ghost btn-sm" data-action="apply-company-filter">${esc(t('Search'))}</button></div><div class="toolbar-right">${button(t('Export'),'btn-primary','export-companies')}</div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Company</th><th>Industry</th><th>Sector</th><th>Size</th><th>Location</th><th>Requests</th><th>Consultations</th><th></th></tr></thead><tbody>${page.data.map(c=>`<tr><td><strong>${esc(c.name)}</strong><br><span class="small muted">${esc(c.id)}</span></td><td>${esc(c.industry)}</td><td>${esc(c.sector)}</td><td>${esc(c.size)}</td><td>${esc(c.city)}, ${esc(c.governorate)}</td><td>${state.db.recruitmentRequests.filter(r=>r.companyId===c.id).length}</td><td>${state.db.consultationRequests.filter(x=>x.companyId===c.id).length}</td><td>${button('Open','btn-ghost btn-sm',`open-company:${c.id}`)}</td></tr>`).join('')}</tbody></table></div>${pagination(page,'company-page')}`,'Companies')}
function companyDetail(id){const c=state.db.companies.find(x=>x.id===id);if(!c)return adminShell('<div class="empty">Company not found</div>','Company');const req=state.db.recruitmentRequests.filter(r=>r.companyId===id), cons=state.db.consultationRequests.filter(x=>x.companyId===id);return adminShell(`<div class="surface" style="padding:22px"><div style="display:flex;justify-content:space-between"><div><h2 style="margin:0;color:var(--primary)">${esc(c.name)}</h2><p class="muted">${esc(c.id)} · ${esc(c.industry)} · ${esc(c.sector)}</p></div>${button('Back','btn-ghost','go-admin-companies')}</div><div class="detail-grid" style="margin-top:18px">${Object.entries(c).filter(([k])=>!['id'].includes(k)).map(([k,v])=>`<div class="detail-item"><div class="label">${esc(k)}</div><div class="value">${esc(v)}</div></div>`).join('')}</div></div><div class="admin-section grid-2"><div class="surface" style="padding:20px"><h3>Recruitment Requests (${req.length})</h3>${req.length?req.map(r=>`<div class="kpi-item"><span>${esc(r.position)}</span>${button('Open','btn-ghost btn-sm',`open-recruitment:${r.id}`)}</div>`).join(''):'<div class="empty">No requests</div>'}</div><div class="surface" style="padding:20px"><h3>Consultation Requests (${cons.length})</h3>${cons.length?cons.map(x=>`<div class="kpi-item"><span>${esc(x.mainSector)}</span>${button('Open','btn-ghost btn-sm',`open-consultation:${x.id}`)}</div>`).join(''):'<div class="empty">No consultations</div>'}</div></div>`,'Company Details')}
function recruitmentAdmin(){let rows=state.db.recruitmentRequests.slice();const q=(state.filters.recruitmentSearch||'').toLowerCase();if(q)rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q));if(state.filters.reqStatus)rows=rows.filter(r=>r.status===state.filters.reqStatus);const page=paginate(rows,state.filters.rqPage||1);return adminShell(`<div class="toolbar"><div class="toolbar-left"><div class="search-box"><input id="recruitmentSearch" placeholder="Search request, company, field, position..." value="${esc(state.filters.recruitmentSearch||'')}"></div><select id="reqStatus"><option value="">All Status</option>${['Open','On Hold','Closed'].map(x=>`<option ${state.filters.reqStatus===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn btn-ghost btn-sm" data-action="apply-recruitment-filter">${esc(t('Filter'))}</button></div><div class="toolbar-right">${button(t('Export'),'btn-primary','export-recruitment')}</div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Request</th><th>Company</th><th>Industry</th><th>Field</th><th>Position</th><th>Level</th><th>Experience</th><th>Location</th><th>Status</th><th></th></tr></thead><tbody>${page.data.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.company)}</td><td>${esc(r.industry)}</td><td>${esc(r.field)}</td><td>${esc(r.position)}</td><td>${esc(r.careerLevel)}</td><td>${r.minExperience}-${r.maxExperience}</td><td>${esc(r.location)}</td><td><span class="badge ${r.status==='Open'?'green':r.status==='On Hold'?'orange':'red'}">${esc(r.status)}</span></td><td>${button('Open','btn-ghost btn-sm',`open-recruitment:${r.id}`)}</td></tr>`).join('')}</tbody></table></div>${pagination(page,'request-page')}`,'Recruitment Requests')}
function recruitmentDetail(id){const r=state.db.recruitmentRequests.find(x=>x.id===id);if(!r)return adminShell('<div class="empty">Request not found</div>','Recruitment Request');return adminShell(`<div class="surface" style="padding:22px"><div style="display:flex;justify-content:space-between;gap:12px"><div><h2 style="margin:0;color:var(--primary)">${esc(r.position)}</h2><p class="muted">${esc(r.id)} · ${esc(r.company)}</p></div>${button('Find Matching Candidates','btn-orange',`run-matching:${r.id}`)}</div><div class="detail-grid" style="margin-top:18px">${Object.entries(r).filter(([k])=>!['id','companyId'].includes(k)).map(([k,v])=>`<div class="detail-item"><div class="label">${esc(k)}</div><div class="value">${esc(Array.isArray(v)?v.join(', '):v)}</div></div>`).join('')}</div></div>${state.db.matchingResults[id]?matchingTable(id):''}`,'Recruitment Request')}

}

function saveCandidateFromForm(){const form=document.getElementById('candidateForm');if(!form)return;const c=parseCandidateForm(form);if(!c)return;if(!c.fullName||!c.email||!c.primaryPhone||!c.targetCareerField||!c.careerLevel){toast('Please complete required candidate fields','error');return}const existingId=state.updateCandidateId;if(existingId){updateDb(existingId,c);state.db.notifications.unshift({id:uid('N'),type:'Candidate Updated Profile',text:`${c.fullName} updated professional profile.`,date:isoNow(),read:false});const idx=state.db.communicationLogs.findIndex(x=>x.candidateId===existingId);if(idx>=0){state.db.communicationLogs[idx].lastDataUpdate=new Date().toISOString().slice(0,10);state.db.communicationLogs[idx].status='Updated'}log('Candidate updated profile','Candidates',existingId);save();const rec=state.db.candidates.find(x=>x.id===existingId);state.lastCandidateResult={id:existingId,count:opportunityCount(rec)};state.updateCandidateId=null;toast('Profile updated and matching recalculated','success');renderContent();return}const id=`QYN-CAN-${String(600000+state.db.candidates.length+1).slice(-6)}`;c.id=id;c.status='New';c.createdDate=isoNow();c.updatedDate=isoNow();state.db.candidates.push(c);state.db.candidateCVs[id]={candidateId:id,fileName:c.cvFileName||''};state.db.candidateApplications[id]={candidateId:id,submittedDate:isoNow(),source:'Public Candidate Form'};state.db.candidateAnalysis[id]=analyzeCandidate(c);state.db.candidateIndicators[id]=state.db.candidateAnalysis[id].indicators;state.db.communicationLogs.unshift({candidateId:id,lastWhatsAppReminder:'',lastEmailReminder:'',lastDataUpdate:new Date().toISOString().slice(0,10),nextUpdateDue:'2026-12-15',status:'Updated'});state.db.notifications.unshift({id:uid('N'),type:'New Candidate',text:`New candidate profile: ${c.fullName}`,date:isoNow(),read:false});log('New Candidate','Candidates',id);save();state.lastCandidateResult={id,count:opportunityCount(c)};toast('Profile submitted successfully','s function saveMatchingRules(){const keys=['experience','skills','competencies','industry','field','education','location','salary','systems','languages','minimumThreshold'];keys.forEach(k=>{const el=document.querySelector(`[name="${k}"]`);if(el)state.db.matchingRules[k]=Number(el.value)||0});save();log('Admin changed matching weight','Matching','matchingRules');toast('Matching rules saved','success');renderContent()}
function saveFormConfig(){document.querySelectorAll('[data-field-row]').forEach(row=>{const f=state.db.formFields.find(x=>x.id===row.dataset.fieldRow);if(!f)return;f.name=row.querySelector('[data-f="name"]').value;f.type=row.querySelector('[data-f="type"]').value;f.required=row.querySelector('[data-f="required"]').checked;f.section=row.querySelector('[data-f="section"]').value;f.order=Number(row.querySelector('[data-f="order"]').value)||0;f.options=row.querySelector('[data-f="options"]').value});save();log('Admin changed form field','Form Builder','candidate form');toast('Form configuration saved','success');renderContent()}
function saveWebsite(){const f=document.getElementById('websiteSettingsForm');const fd=new FormData(f),o=Object.fromEntries(fd.entries());const s=state.db.siteSettings;s.heroTitle=o.heroTitle;s.heroSubtitle=o.heroSubtitle;s.heroText=o.heroText;s.ctaPrimary=o.ctaPrimary;s.ctaConsult=o.ctaConsult;s.ctaOpportunity=o.ctaOpportunity;s.ctaRecruitment=o.ctaRecruitment;s.aboutText=o.aboutText;s.recruitmentText=o.recruitmentText;s.consultationText=o.consultationText;s.footer=o.footer;s.contact.email=o.contactEmail;s.contact.whatsapp=o.contactWhatsApp;s.contact.phone=o.contactPhone;save();log('Admin changed homepage','Website', 'siteSettings');toast('Website settings saved','success');renderContent()}
function runCampaign(){const date=new Date().toISOString().slice(0,10);let wa=0,email=0;state.db.communicationLogs.forEach(l=>{if(l.status==='Due'){const c=state.db.candidates.find(x=>x.id===l.candidateId);if(!c)return;if(c.preferredContactMethod==='WhatsApp'||c.whatsappNumber){l.lastWhatsAppReminder=date;wa++}else{l.lastEmailReminder=date;email++}l.status='Reminder Sent'}});const last=state.db.dataUpdateCampaigns[0];last.lastCampaign=date;last.nextCampaign='2027-01-01';last.whatsappDemoMessages+=wa;last.emailDemoMessages+=email;last.candidatesUpdated=state.db.communicationLogs.filter(x=>x.status==='Updated').length;last.candidatesNotUpdated=state.db.communicationLogs.filter(x=>x.status!=='Updated').length;last.completionRate=Math.round(last.candidatesUpdated/state.db.communicationLogs.length*100);log('Admin ran quarterly campaign','Data Update',last.id);save();toast(`Quarterly demo campaign processed ${wa+email} messages`,'success');renderContent()}
function assignConsult(id){const x=state.db.consultationRequests.find(c=>c.id===id),e=state.db.employees.find(v=>v.id===document.getElementById('assignEmployee')?.value);if(!x)return;x.assignedEmployee=e?.name||'';x.updatedDate=isoNow();x.status=e?'Assigned':x.status;x.activity.push({date:isoNow(),by:state.role,action:`Assigned to ${e?.name||'Unassigned'}`});state.db.notifications.unshift({id:uid('N'),type:'Consultation Assigned',text:`${x.id} assigned to ${e?.name||'Unassigned'}`,date:isoNow(),read:false});log('Admin assigned consultation','Consultations',id);save();toast('Consultation assigned','success');renderContent()}
function updateConsultStatus(id){const x=state.db.consultationRequests.find(c=>c.id===id),s=document.getElementById('consultStatus')?.value;if(!x)return;x.status=s;x.updatedDate=isoNow();x.activity.push({date:isoNow(),by:state.role,action:`Status changed to ${s}`});save();log('Admin changed consultation status','Consultations',id);toast('Status updated','success');renderContent()}
function addConsultNote(id){const x=state.db.consultationRequests.find(c=>c.id===id),n=document.getElementById('internalNote')?.value.trim();if(!x||!n)return toast('Enter an internal note','error');x.notes=(x.notes?x.notes+'\n':'')+`[${new Date().toLocaleString()}] ${state.role}: ${n}`;x.activity.push({date:isoNow(),by:state.role,action:'Internal note added'});save();log('Admin added internal note','Consultations',id);toast('Internal note added','success');renderContent()}
function saveMatchNote(rid,cid){const n=document.getElementById(`recruiterNote_${rid}_${cid}`)?.value.trim();if(!n)return toast('Enter a recruiter note','error');const c=state.db.candidates.find(x=>x.id===cid);c.recruiterNotes=(c.recruiterNotes?c.recruiterNotes+'\n':'')+`[${new Date().toLocaleString()}] ${state.role}: ${n}`;save();log('Recruiter added match note','Matching',cid);toast('Recruiter note saved','success')}
function employeeModeModal(){openModal(`<h2 style="color:var(--primary)">Demo Employee Mode</h2><p class="muted">Choose an employee to simulate module-specific visibility.</p><div class="grid-2">${state.db.employees.map(e=>`<button class="choice-card" style="cursor:pointer" data-action="use-employee" data-id="${e.id}"><h3>${esc(e.name)}</h3><p class="muted">${esc(e.dept)} · ${esc(e.specialization)}</p></button>`).join('')}</div><div class="form-actions">${button('Close','btn-ghost','close-modal')}</div>`)}
function setEmployee(id){state.employeeId=id;const e=state.db.employees.find(x=>x.id===id);if(e)state.role=e.dept;save();closeModal();toast(`Employee mode: ${e?.name||id}`,'success');renderContent()}
function handleAction(action,el){const [cmd,...parts]=String(action||'').split(':');switch(cmd){case'toggle-lang':state.lang=state.lang==='en'?'ar':'en';localStorage.setItem(APP_KEY+'_lang',state.lang);renderContent();break;case'go-services':go('#services');break;case'go-consult':go('#consultation');break;case'go-candidate':state.lastCandidateResult=null;go('#candidate');break;case'go-recruitment':go('#recruitment-request');break;case'go-home':go('#home');break;case'clear-candidate-result':state.lastCandidateResult=null;go('#home');break;case'admin-login':go('#admin-login');break;case'admin-logout':state.admin=false;state.role='Super Admin';go('#home');break;case'preview-noop':toast('Live preview is active. Change a design value and watch the preview update.');break;case'consult-service':go('#consultation');break;case'open-mobile':openPublicDrawer();break;case'open-mobile-admin':openAdminDrawer();break;case'open-candidate':state.tab='Overview';go('#admin/candidate/'+parts[0]);break;case'candidate-tab':state.tab=parts[0];renderContent();break;case'edit-candidate':state.updateCandidateId=parts[0];go('#candidate');break;case'open-company':go('#admin/company/'+parts[0]);break;case'go-admin-companies':go('#admin/companies');break;case'open-recruitment':go('#admin/recruitment/'+parts[0]);break;case'go-admin-consultations':go('#admin/consultations');break;case'open-consultation':go('#admin/consultations/'+parts[0]);break;case'match-breakdown':go('#admin/matching/'+parts[0]+'/'+parts[1]);break;case'run-matching':runMatching(state.db.recruitmentRequests.find(r=>r.id===parts[0]));renderContent();toast('Matching recalculated from current data','success');break;case'shortlist':{const c=state.db.candidates.find(x=>x.id===parts[0]);if(c){c.status='Shortlisted';save();log('Candidate shortlisted','Candidates',c.id);toast('Candidate shortlisted','success');renderContent()}}break;case'save-match-note':saveMatchNote(parts[0],parts[1]);break;case'demo-whatsapp':demoMessageCandidate(parts[0],'whatsapp');break;case'demo-email':demoMessageCandidate(parts[0],'email');break;case'candidate-reminder':demoMessageCandidate(parts[0],'whatsapp');break;case'send-demo':sendDemo(parts[0],parts[1]);break;case'send-consult-demo':{const x=state.db.consultationRequests.find(c=>c.id===parts[0]);if(x){x.activity.push({date:isoNow(),by:state.role,action:`Demo ${parts[1]} message sent`});x.updatedDate=isoNow();log(`Admin sent demo ${parts[1]}`,'Consultations',x.id);save();closeModal();toast(`Demo ${parts[1]} message recorded`,'success');renderContent()}break}case'close-modal':closeModal();break;case'lookup-candidate':lookupCandidate();break;case'load-update':state.updateCandidateId=parts[0];go('#candidate');break;case'create-new-update':state.updateCandidateId=null;state.lastCandidateResult=null;go('#candidate');break;case'submit-candidate':saveCandidateFromForm();break;case'add-experience':addExperienceItem();break;case'remove-experience':el.closest('.repeat-item')?.remove();renumberExperiences();break;case'submit-recruitment':submitRecruitment(document.getElementById('recruitmentForm'));break;case'submit-consultation':submitConsultation(document.getElementById('consultationForm'));break;case'email-contact':openContact('email');break;case'whatsapp-contact':openContact('whatsapp');break;case'phone-contact':openContact('phone');break;case'login-submit':performLogin();break;case'admin-stat':go(el.dataset.route);break;case'export-candidates':csvExport(state.db.candidates,'QYNERA_Candidates.csv');break;case'export-companies':csvExport(state.db.companies,'QYNERA_Companies.csv');break;case'export-recruitment':csvExport(state.db.recruitmentRequests,'QYNERA_Recruitment_Requests.csv');break;case'export-consultations':csvExport(state.db.consultationRequests,'QYNERA_Consultations.csv');break;case'export-communications':csvExport(state.db.communicationLogs,'QYNERA_Communication_Logs.csv');break;case'export-audit':csvExport(state.db.auditLogs,'QYNERA_Audit_Logs.csv');break;case'export-candidate':{const c=state.db.candidates.find(x=>x.id===parts[0]);csvExport([c],'QYNERA_Candidate_'+parts[0]+'.csv');break}case'export-candidate-matches':{const c=state.db.candidates.find(x=>x.id===parts[0]);const rows=state.db.recruitmentRequests.map(r=>{const m=matchCandidateToRequest(c,r);return {request:r.id,company:r.company,position:r.position,overall:m.overall}});csvExport(rows,'QYNERA_Candidate_Matches_'+parts[0]+'.csv');break}case'export-matching':{const arr=state.db.matchingResults[parts[0]]||runMatching(state.db.recruitmentRequests.find(r=>r.id===parts[0]));csvExport(arr,'QYNERA_Matching_'+parts[0]+'.csv');break}case'export-all-matching':csvExport(Object.values(state.db.matchingResults).flat(),'QYNERA_All_Matching.csv');break;case'export-candidate-field':csvExport(state.db.candidates.map(c=>({id:c.id,name:c.fullName,field:c.targetCareerField,score:state.db.candidateAnalysis[c.id]?.overall||0})),'QYNERA_Candidate_Field.csv');break;case'export-consult-sector':csvExport(state.db.consultationRequests.map(x=>({id:x.id,sector:x.mainSector,subSector:x.subSector,status:x.status})),'QYNERA_Consultation_Sectors.csv');break;case'view-report':reportModal(Number(parts[0]));break;case'page':handlePage(parts[0],Number(el.dataset.page));break;case'apply-candidate-filter':state.filters.candidateSearch=document.getElementById('candidateSearch')?.value||'';state.filters.field=document.getElementById('candidateField')?.value||'';state.filters.cp=1;renderContent();break;case'apply-company-filter':state.filters.companySearch=document.getElementById('companySearch')?.value||'';state.filters.compPage=1;renderContent();break;case'apply-recruitment-filter':state.filters.recruitmentSearch=document.getElementById('recruitmentSearch')?.value||'';state.filters.reqStatus=document.getElementById('reqStatus')?.value||'';state.filters.rqPage=1;renderContent();break;case'apply-consult-filter':state.filters.consultSearch=document.getElementById('consultSearch')?.value||'';state.filters.consultSector=document.getElementById('consultSector')?.value||'';state.filters.conPage=1;renderContent();break;case'consult-sector':{state.filters.consultSector=parts.join(':');renderContent();break}case'apply-audit-filter':state.filters.auditSearch=document.getElementById('auditSearch')?.value||'';renderContent();break;case'change-employee':employeeModeModal();break;case'use-employee':setEmployee(parts[0]||el.dataset.id);break;case'read-all':state.db.notifications.forEach(n=>n.read=true);save();renderContent();break;case'run-campaign':runCampaign();break;case'assign-consult':assignConsult(parts[0]);break;case'consult-status':updateConsultStatus(parts[0]);break;case'consult-note':addConsultNote(parts[0]);break;case'consult-email':demoConsultMessage(parts[0],'email');break;case'consult-whatsapp':demoConsultMessage(parts[0],'whatsapp');break;case'reset-theme':state.theme={...DEFAULT_THEME};setThemeVars();save();renderContent();toast('Default theme restored','success');break;case'save-theme':saveThemeFromUI();toast('Theme saved','success');renderContent();break;case'save-assessment':saveAssessment();break;case'save-matching-rules':saveMatchingRules();break;case'normalize-weights':normalizeMatchingWeights();break;case'save-form-config':saveFormConfig();break;case'save-website':saveWebsite();break;case'save-permissions':savePermissions();break;case'open-new-candidate':state.updateCandidateId=null;go('#candidate');break;case'reset-demo':resetDemo();break;default:toast('Action not recognized','error')}}
function handlePage(key,page){if(page<1)return;const map={"candidate-page":"cp","company-page":"compPage","request-page":"rqPage","consult-page":"conPage"};state.filters[map[key]]=page;renderContent()}
function addExperienceItem(){const list=document.getElementById('experienceList');if(!list)return;const i=list.querySelectorAll('.repeat-item').length;const div=document.createElement('div');div.innerHTML=experienceItem({},i);list.appendChild(div.firstElementChild)}
function renumberExperiences(){document.querySelectorAll('#experienceList .repeat-item').forEach((x,i)=>{x.dataset.expIndex=i;const h=x.querySelector('.repeat-head strong');if(h)h.textContent=`Company ${i+1}`})}
function performLogin(){const f=document.getElementById('loginForm');const fd=new FormData(f);const u=state.db.adminUsers.find(x=>x.username===fd.get('username')&&x.password===fd.get('password'));if(!u){toast('Demo credentials are admin / demo','error');return}state.admin=true;state.role=fd.get('role')||u.role;state.employeeId='EMP-001';log('Admin login','Authentication','admin');go('#admin');}
function openContact(type){const c=state.db.siteSettings.contact;if(type==='email')location.href='mailto:'+c.email;else if(type==='phone')location.href='tel:'+c.phone;else{const digits=String(c.whatsapp||'').replace(/\D/g,'');if(digits.length>=8)window.open('https://wa.me/'+digits,'_blank');else toast('Demo WhatsApp number is not configured with a valid numeric value.','error')}}
function demoConsultMessage(id,type){const x=state.db.consultationRequests.find(c=>c.id===id);if(!x)return;const text=`Hello ${x.contactPerson},\n\nThis is a QYNERA Demo ${type} communication for consultation ${x.id}.\nSector: ${x.mainSector}\nStatus: ${x.status}\n\nNo real message is being sent in this prototype.`;openModal(`<h2 style="color:var(--primary)">Demo ${esc(type)}</h2><pre style="white-space:pre-wrap;background:#F7F9FB;border:1px solid var(--line);padding:16px;border-radius:12px;font-family:inherit">${esc(text)}</pre><div class="form-actions">${button('Close','btn-ghost','close-modal')}${button('Send Demo Message','btn-primary',`send-consult-demo:${id}:${type}`)}</div>`)}
function openPublicDrawer(){const d=document.getElementById('mobileDrawer');d.innerHTML=`<div class="drawer-panel"><div style="display:flex;justify-content:space-between;align-items:center"><strong style="color:var(--primary);font-size:1.2rem">QYNERA</strong><button class="btn btn-ghost btn-sm" data-action="close-drawer">Close</button></div><div style="display:grid;gap:6px;margin-top:18px">${[['#home','Home'],['#about','About'],['#services','Services'],['#recruitment','Recruitment'],['#candidate','Opportunity'],['#recruitment-request','RequestRecruitment'],['#consultation','Consultation'],['#update-data','Update'],['#contact','Contact'],['#admin-login','AdminLogin']].map(x=>`<a class="side-btn" style="color:var(--primary)" href="${x[0]}">${esc(t(x[1]))}</a>`).join('')}</div></div>`;d.classList.add('open')}
function openAdminDrawer(){const d=document.getElementById('mobileDrawer');d.innerHTML=`<div class="drawer-panel"><div style="display:flex;justify-content:space-between;align-items:center"><strong style="color:var(--primary);font-size:1.2rem">QYNERA Admin</strong><button class="btn btn-ghost btn-sm" data-action="close-drawer">Close</button></div><div style="display:grid;gap:6px;margin-top:18px">${adminNav().replace(/class="side-btn/g,'class="side-btn').replace(/href=/g,'data-admin-link-href=')}</div></div>`;d.classList.add('open');d.querySelectorAll('[data-admin-link-href]').forEach(a=>{const h=a.getAttribute('data-admin-link-href');a.addEventListener('click',e=>{e.preventDefault();d.classList.remove('open');go(h)})})}
function closeDrawer(){document.getElementById('mobileDrawer').classList.remove('open')}

function adaptiveQuestionField(q,idx,lang,value=''){const name=q[0], en=q[1], ar=FIELD_QUESTIONS_AR[state.__selectedField]?.[idx]||en, label=lang==='ar'?ar:en;const type=q[2];const opts=q[3]||[];return inputField(name,label,value,{type:type==='textarea'?'textarea':type==='select'?'select':'text',options:opts,full:type==='textarea'});}
function adaptiveQuestions(field){state.__selectedField=field||'Other';const qs=FIELD_QUESTIONS[state.__selectedField]||FIELD_QUESTIONS.Other;return `<div class="form-section" id="fieldSpecificSection"><h3>${state.lang==='ar'?'اسئلة مرتبطة بمجالك':'Questions specific to your field'}</h3><p class="muted small">${state.lang==='ar'?'ستتغير هذه الاسئلة تلقائيا حسب المجال الوظيفي الذي تختاره':'These questions change according to the career field you select.'}</p><div class="field-grid">${qs.map((q,i)=>adaptiveQuestionField(q,i,state.lang,c0?.fieldSpecific?.[q[0]]||'')).join('')}</div></div>`}
